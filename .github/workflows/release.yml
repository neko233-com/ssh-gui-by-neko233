name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ssh-gui-by-neko233-windows-x64
            path: dist/ssh-gui-by-neko233-win32-x64.exe
            package: dist/ssh-gui-by-neko233-windows-x64.zip
            binary: true
          - os: ubuntu-latest
            artifact: ssh-gui-by-neko233-linux-x64
            path: dist/linux/README.txt
            package: dist/ssh-gui-by-neko233-linux-x64.tar.gz
            binary: false
          - os: macos-latest
            artifact: ssh-gui-by-neko233-macos-arm64
            path: dist/ssh-gui-by-neko233-darwin-arm64
            package: dist/ssh-gui-by-neko233-macos-arm64.tar.gz
            binary: true
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup LLVM on Windows
        if: runner.os == 'Windows'
        run: winget install LLVM.LLVM --accept-package-agreements --accept-source-agreements

      - name: Setup LLVM on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            llvm \
            build-essential \
            pkg-config \
            libgtk-4-dev \
            libshumate-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libwebkitgtk-6.0-dev \
            libpulse-dev
          llvm-ar --version

      - name: Setup Xcode tools on macOS
        if: runner.os == 'macOS'
        run: xcode-select -p

      - name: Install dependencies
        run: npm ci

      - name: Check
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export PERRY_LLVM_CLANG="C:/Program Files/LLVM/bin/clang.exe"
          fi
          npm run check

      - name: Build
        if: matrix.binary
        shell: bash
        env:
          BUILD_OUTPUT: ${{ matrix.path }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export PERRY_LLVM_CLANG="C:/Program Files/LLVM/bin/clang.exe"
          fi
          npm run build

      - name: Prepare Linux package placeholder
        if: runner.os == 'Linux' && !matrix.binary
        shell: bash
        run: |
          mkdir -p dist/linux
          cat > dist/linux/README.txt <<'EOF'
          Linux native GUI binary is temporarily disabled for @perryts/perry-linux-x64 0.5.1025.

          Root cause:
          libperry_stdlib.a references aws_lc_0_41_0_poly_Rq_mul from hrss.o, but the published Linux Perry static libraries do not define that symbol.

          CI still runs npm run check on Linux. Re-enable Linux native packaging when Perry publishes a fixed Linux package.
          EOF
          cp README.md README.en.md package.json package-lock.json perry.toml spec.md dist/linux/

      - name: Package artifact
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path '${{ matrix.path }}' -DestinationPath '${{ matrix.package }}' -Force"
          else
            if [ "${{ matrix.binary }}" = "true" ]; then
              tar -czf "${{ matrix.package }}" -C dist "$(basename '${{ matrix.path }}')"
            else
              tar -czf "${{ matrix.package }}" -C dist linux
            fi
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.package }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          generate_release_notes: true
